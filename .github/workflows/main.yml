name: Remote iOS 26.5 Simulator

# Save as .github/workflows/remote-ios-simulator.yml, then run it from the Actions tab.
# When the last step prints the link (also in the run's Summary page), open it in any browser.
#
# Controls: click/tap = touch, drag = swipe, hold = long press.
# Side panel: Home, Lock, App Switcher, Siri, dark/light, open URL, launch app, type text, screenshot, Stop.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'iOS version'
        default: '26.5'
        required: true
      device:
        description: 'Simulator device name (exact). The log lists what the runtime supports.'
        default: 'iPhone 17 Pro'
        required: true
      minutes:
        description: 'How long to keep the session alive (max ~340)'
        default: '120'
        required: true

jobs:
  simulator:
    name: iOS ${{ inputs.version }} simulator
    runs-on: macos-26
    timeout-minutes: 355
    env:
      VER: ${{ inputs.version }}
      DEVICE: ${{ inputs.device }}
      MINUTES: ${{ inputs.minutes }}

    steps:
      - name: Select newest installed Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - name: Ensure the iOS runtime is installed
        run: |
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes | grep -q "iOS ${VER}"; then
            echo "Runtime not preinstalled, downloading (large, can take a while)..."
            xcodebuild -downloadPlatform iOS -buildVersion "${VER}"
          fi
          xcrun simctl list runtimes

      - name: Create and boot the simulator
        run: |
          RT_ID=$(xcrun simctl list runtimes -j | jq -r --arg v "$VER" \
            '[.runtimes[] | select(.platform=="iOS" and (.version|startswith($v)))][0].identifier // empty')
          if [ -z "$RT_ID" ]; then echo "No iOS $VER runtime found"; exit 1; fi
          echo "Runtime: $RT_ID"
          echo "Supported devices for this runtime:"
          xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" \
            '.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | "  - " + .name + " (" + .productFamily + ")"'

          DT=$(xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" --arg n "$DEVICE" \
            '[.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | select(.name==$n)][0].identifier // empty')
          FAMILY=$(xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" --arg n "$DEVICE" \
            '[.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | select(.name==$n)][0].productFamily // empty')
          if [ -z "$DT" ]; then
            echo "Device '$DEVICE' not supported, falling back to the first iPhone"
            DT=$(xcrun simctl list runtimes -j | jq -r --arg id "$RT_ID" \
              '[.runtimes[] | select(.identifier==$id) | .supportedDeviceTypes[] | select(.productFamily=="iPhone")][0].identifier')
            FAMILY=iPhone
          fi
          UDID=$(xcrun simctl create "Remote-$VER" "$DT" "$RT_ID")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          if [ "$FAMILY" = "iPad" ]; then echo "DENSITY=2" >> "$GITHUB_ENV"; else echo "DENSITY=3" >> "$GITHUB_ENV"; fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Required: this is what makes the web link work. No continue-on-error,
      # so a failure here stops the run immediately instead of 3 minutes later.
      - name: Install cloudflared (tunnel)
        run: |
          brew install cloudflared
          cloudflared --version

      # Optional: touch/button input. If this fails you still get a view-only simulator.
      - name: Install idb (touch input)
        continue-on-error: true
        run: |
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pip install fb-idb
          idb --help | head -3

      - name: Write the web server
        run: |
          cat > server.py <<'PYEOF'
          #!/usr/bin/env python3
          import hmac, json, os, secrets, struct, subprocess, tempfile, threading, time, urllib.parse
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          UDID = os.environ["UDID"]
          TOKEN = os.environ["TOKEN"]
          PORT = int(os.environ.get("PORT", "8080"))
          SCALE_H = int(os.environ.get("SCALE_H", "1100"))
          DENSITY = float(os.environ.get("DENSITY", "3"))
          IDB = os.environ.get("IDB", "idb")

          FRAME = {"data": b"", "id": 0, "rw": 0, "rh": 0}
          COND = threading.Condition()
          STOP = threading.Event()
          LOCK = threading.Lock()
          POINTS = {"v": None}
          SERVER = None


          def jpeg_size(b):
              i = 2
              while i < len(b) - 9:
                  if b[i] != 0xFF:
                      i += 1
                      continue
                  m = b[i + 1]
                  if m in (0xC0, 0xC1, 0xC2):
                      h, w = struct.unpack(">HH", b[i + 5:i + 9])
                      return w, h
                  if m in (0xD8, 0x01) or 0xD0 <= m <= 0xD7:
                      i += 2
                      continue
                  i += 2 + struct.unpack(">H", b[i + 2:i + 4])[0]
              return 0, 0


          def capture_loop():
              tmp = tempfile.gettempdir()
              raw = os.path.join(tmp, "sim_raw.jpg")
              small = os.path.join(tmp, "sim_small.jpg")
              while not STOP.is_set():
                  t = time.time()
                  r = subprocess.run(["xcrun", "simctl", "io", UDID, "screenshot", "--type=jpeg", raw],
                                     capture_output=True)
                  if r.returncode == 0:
                      src = raw
                      try:
                          rw, rh = jpeg_size(open(raw, "rb").read(4096 * 16))
                      except Exception:
                          rw, rh = 0, 0
                      if SCALE_H > 0:
                          s = subprocess.run(["sips", "--resampleHeight", str(SCALE_H), "-s", "formatOptions", "60",
                                              raw, "--out", small], capture_output=True)
                          if s.returncode == 0:
                              src = small
                      try:
                          data = open(src, "rb").read()
                      except Exception:
                          continue
                      with COND:
                          FRAME.update(data=data, id=FRAME["id"] + 1, rw=rw, rh=rh)
                          COND.notify_all()
                  dt = time.time() - t
                  if dt < 0.08:
                      time.sleep(0.08 - dt)


          def run(cmd, timeout=40):
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout)
                  out = (r.stdout + r.stderr).strip()
                  return {"ok": r.returncode == 0, "msg": (out[:300] if out else "ok")}
              except FileNotFoundError:
                  return {"ok": False, "msg": "command not found: " + cmd[0]}
              except Exception as e:
                  return {"ok": False, "msg": str(e)}


          def idb(args):
              return run([IDB] + args + ["--udid", UDID])


          def points():
              if POINTS["v"]:
                  return POINTS["v"]
              try:
                  out = subprocess.run([IDB, "describe", "--udid", UDID, "--json"],
                                       capture_output=True, text=True, timeout=25).stdout
                  sd = json.loads(out)["screen_dimensions"]
                  POINTS["v"] = (float(sd["width_points"]), float(sd["height_points"]))
                  return POINTS["v"]
              except Exception:
                  return (FRAME["rw"] / DENSITY, FRAME["rh"] / DENSITY)


          def handle(path, b):
              if path == "/tap":
                  W, H = points()
                  a = ["ui", "tap", str(round(b["x"] * W)), str(round(b["y"] * H))]
                  if b.get("dur", 0) > 0:
                      a += ["--duration", str(b["dur"])]
                  return idb(a)
              if path == "/swipe":
                  W, H = points()
                  a = ["ui", "swipe", str(round(b["x1"] * W)), str(round(b["y1"] * H)),
                       str(round(b["x2"] * W)), str(round(b["y2"] * H)), "--duration", str(b.get("dur", 0.3))]
                  return idb(a)
              if path == "/button":
                  name = b.get("name", "")
                  if name not in ("HOME", "LOCK", "SIDE_BUTTON", "SIRI", "APPLE_PAY"):
                      return {"ok": False, "msg": "bad button"}
                  return idb(["ui", "button", name])
              if path == "/text":
                  return idb(["ui", "text", str(b.get("text", ""))])
              if path == "/key":
                  return idb(["ui", "key", str(int(b["code"]))])
              if path == "/appearance":
                  mode = b.get("mode")
                  if mode not in ("light", "dark"):
                      return {"ok": False, "msg": "bad mode"}
                  return run(["xcrun", "simctl", "ui", UDID, "appearance", mode])
              if path == "/openurl":
                  return run(["xcrun", "simctl", "openurl", UDID, str(b.get("url", ""))])
              if path == "/launch":
                  return run(["xcrun", "simctl", "launch", UDID, str(b.get("bundle", ""))])
              if path == "/stop":
                  STOP.set()
                  with COND:
                      COND.notify_all()
                  threading.Thread(target=SERVER.shutdown, daemon=True).start()
                  return {"ok": True, "msg": "stopping session"}
              return {"ok": False, "msg": "unknown action"}


          PAGE = r'''<!doctype html><html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>iOS Simulator</title>
          <style>
          :root{color-scheme:dark}
          *{box-sizing:border-box}
          body{margin:0;background:#0f1115;color:#e6e6e6;font:14px -apple-system,system-ui,sans-serif;min-height:100vh;
               display:flex;align-items:center;justify-content:center;padding:12px}
          #wrap{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
          #bezel{background:#000;border-radius:46px;padding:12px;box-shadow:0 0 0 2px #333,0 12px 40px #000a}
          #scr{touch-action:none;cursor:pointer;line-height:0;border-radius:34px;overflow:hidden;background:#111;min-width:200px;min-height:300px}
          #img{max-height:86vh;max-width:min(80vw,520px);display:block;user-select:none;-webkit-user-drag:none}
          #side{display:flex;flex-direction:column;gap:8px;width:190px}
          button{background:#1d212b;color:#e6e6e6;border:1px solid #2c3140;border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
          button:active{background:#2a3040}
          button.danger{border-color:#7a2b2b;color:#ff9b9b}
          input{background:#161a22;color:#e6e6e6;border:1px solid #2c3140;border-radius:10px;padding:9px 10px;font:inherit;width:100%}
          .row{display:flex;gap:6px}.row>*{flex:1}
          #toast{min-height:18px;font-size:12px;color:#9aa4b8;word-break:break-word}
          h4{margin:6px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7f8aa3;font-weight:600}
          </style></head><body>
          <div id="wrap">
            <div id="bezel"><div id="scr"><img id="img" alt="" draggable="false"></div></div>
            <div id="side">
              <h4>Hardware</h4>
              <button onclick="btn('HOME')">Home</button>
              <button onclick="btn('LOCK')">Lock / Side</button>
              <button onclick="btn('SIRI')">Siri</button>
              <h4>Gestures</h4>
              <button onclick="gest(0.5,0.995,0.5,0.6,0.25)">Swipe-up Home</button>
              <button onclick="gest(0.5,0.995,0.5,0.55,1.0)">App Switcher</button>
              <button onclick="gest(0.5,0.01,0.5,0.6,0.3)">Notification Center</button>
              <button onclick="gest(0.95,0.01,0.95,0.5,0.3)">Control Center</button>
              <h4>Appearance</h4>
              <div class="row"><button onclick="post('/appearance',{mode:'light'})">Light</button><button onclick="post('/appearance',{mode:'dark'})">Dark</button></div>
              <h4>Type</h4>
              <input id="txt" placeholder="text to type">
              <div class="row"><button onclick="sendText()">Send</button><button onclick="post('/key',{code:40})">Enter</button><button onclick="post('/key',{code:42})">&#9003;</button></div>
              <h4>Open</h4>
              <input id="url" placeholder="https://..."><button onclick="post('/openurl',{url:val('url')})">Open URL</button>
              <input id="bid" placeholder="com.apple.mobilesafari"><button onclick="post('/launch',{bundle:val('bid')})">Launch app</button>
              <h4>Session</h4>
              <button onclick="location.href='/shot.png'">Save screenshot</button>
              <button class="danger" onclick="if(confirm('Stop the session?'))post('/stop',{})">Stop session</button>
              <div id="toast"></div>
            </div>
          </div>
          <script>
          const img=document.getElementById('img'),scr=document.getElementById('scr'),tt=document.getElementById('toast');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          function val(i){return document.getElementById(i).value}
          function toast(m){tt.textContent=m}
          async function post(p,b){try{const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const j=await r.json();toast(j.msg||(j.ok?'ok':'error'))}catch(e){toast('request failed')}}
          function btn(n){post('/button',{name:n})}
          function gest(x1,y1,x2,y2,d){post('/swipe',{x1:x1,y1:y1,x2:x2,y2:y2,dur:d})}
          function sendText(){post('/text',{text:val('txt')});document.getElementById('txt').value=''}
          let last=0;
          async function loop(){
            while(true){
              try{
                const r=await fetch('/frame?after='+last,{cache:'no-store'});
                if(r.status===200){last=parseInt(r.headers.get('X-Frame-Id'));const b=await r.blob();const u=URL.createObjectURL(b);const old=img.src;img.src=u;if(old&&old.startsWith('blob:'))URL.revokeObjectURL(old)}
                else if(r.status===410){toast('session stopped');return}
                else await sleep(200);
              }catch(e){await sleep(1000)}
            }
          }
          loop();
          let down=null;
          function frac(x,y){const r=img.getBoundingClientRect();return[Math.min(1,Math.max(0,(x-r.left)/r.width)),Math.min(1,Math.max(0,(y-r.top)/r.height))]}
          scr.addEventListener('pointerdown',e=>{scr.setPointerCapture(e.pointerId);down={x:e.clientX,y:e.clientY,t:performance.now()};e.preventDefault()});
          scr.addEventListener('pointerup',e=>{
            if(!down)return;
            const dx=e.clientX-down.x,dy=e.clientY-down.y,dt=(performance.now()-down.t)/1000;
            const a=frac(down.x,down.y),b=frac(e.clientX,e.clientY);
            if(Math.hypot(dx,dy)<10){post('/tap',{x:b[0],y:b[1],dur:dt>0.5?Math.min(dt,3):0})}
            else{post('/swipe',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],dur:Math.max(0.1,Math.min(dt,1.5))})}
            down=null;e.preventDefault()});
          scr.addEventListener('pointercancel',()=>{down=null});
          </script></body></html>'''


          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, *a):
                  pass

              def _auth(self):
                  qs = urllib.parse.parse_qs(urllib.parse.urlparse(self.path).query)
                  cand = [qs.get("key", [""])[0]]
                  for part in self.headers.get("Cookie", "").split(";"):
                      k, _, v = part.strip().partition("=")
                      if k == "k":
                          cand.append(v)
                  return any(c and hmac.compare_digest(c.encode(), TOKEN.encode()) for c in cand)

              def _send(self, code, body, ctype, extra=None):
                  self.send_response(code)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(body)))
                  for k, v in (extra or {}).items():
                      self.send_header(k, v)
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if not self._auth():
                      return self._send(403, b"forbidden", "text/plain")
                  u = urllib.parse.urlparse(self.path)
                  qs = urllib.parse.parse_qs(u.query)
                  if u.path == "/":
                      cookie = "k=%s; Path=/; HttpOnly; Secure; SameSite=Lax" % TOKEN
                      return self._send(200, PAGE.encode(), "text/html; charset=utf-8", {"Set-Cookie": cookie})
                  if u.path == "/frame":
                      after = int(qs.get("after", ["0"])[0] or 0)
                      with COND:
                          COND.wait_for(lambda: FRAME["id"] > after or STOP.is_set(), timeout=10)
                          data, fid = FRAME["data"], FRAME["id"]
                      if STOP.is_set():
                          return self._send(410, b"stopped", "text/plain")
                      if fid <= after or not data:
                          return self._send(204, b"", "text/plain")
                      return self._send(200, data, "image/jpeg", {"X-Frame-Id": str(fid), "Cache-Control": "no-store"})
                  if u.path == "/shot.png":
                      p = os.path.join(tempfile.gettempdir(), "shot.png")
                      r = subprocess.run(["xcrun", "simctl", "io", UDID, "screenshot", p], capture_output=True)
                      if r.returncode != 0:
                          return self._send(500, b"screenshot failed", "text/plain")
                      return self._send(200, open(p, "rb").read(), "image/png",
                                        {"Content-Disposition": "attachment; filename=simulator.png"})
                  self._send(404, b"not found", "text/plain")

              def do_POST(self):
                  if not self._auth():
                      return self._send(403, b"forbidden", "text/plain")
                  n = int(self.headers.get("Content-Length", "0") or 0)
                  try:
                      body = json.loads(self.rfile.read(n) or b"{}")
                  except Exception:
                      body = {}
                  path = urllib.parse.urlparse(self.path).path
                  try:
                      with LOCK:
                          res = handle(path, body)
                  except Exception as e:
                      res = {"ok": False, "msg": "error: %s" % e}
                  self._send(200, json.dumps(res).encode(), "application/json")


          if __name__ == "__main__":
              threading.Thread(target=capture_loop, daemon=True).start()
              ThreadingHTTPServer.daemon_threads = True
              SERVER = ThreadingHTTPServer(("127.0.0.1", PORT), Handler)
              try:
                  SERVER.serve_forever()
              finally:
                  STOP.set()
          PYEOF
          python3 -m py_compile server.py && echo "server.py OK"

      - name: Start session and print the link
        run: |
          export TOKEN=$(openssl rand -hex 12)
          export PORT=8080

          command -v cloudflared >/dev/null || { echo "cloudflared missing, cannot create the web link"; exit 1; }

          # idb companion for touch / button input (optional)
          if command -v idb_companion >/dev/null && command -v idb >/dev/null; then
            nohup idb_companion --udid "$UDID" --grpc-port 10882 > companion.log 2>&1 &
            sleep 6
            idb connect localhost 10882 || true
            echo "--- idb self-test (failures here mean touch input won't work, view-only still will) ---"
            idb ui tap 100 100 --udid "$UDID" || echo "idb tap FAILED"
            idb ui button HOME --udid "$UDID" || echo "idb button FAILED"
          else
            echo "idb / idb_companion missing: view-only session (no touch input)"
          fi

          nohup python3 server.py > server.log 2>&1 &
          SERVER_PID=$!
          sleep 4
          curl -fsS "http://127.0.0.1:$PORT/?key=$TOKEN" -o /dev/null || { cat server.log; exit 1; }

          nohup cloudflared tunnel --url "http://127.0.0.1:$PORT" --no-autoupdate > cf.log 2>&1 &
          CF_PID=$!
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then cat cf.log; exit 1; fi

          FULL="$URL/?key=$TOKEN"
          echo "::notice title=Simulator link::$FULL"
          {
            echo "## iOS $VER simulator is live"
            echo
            echo "$FULL"
            echo
            echo "Anyone with this link can control the simulator. It ends in $MINUTES minutes or when you press Stop session."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "OPEN THIS: $FULL"

          END=$((SECONDS + MINUTES * 60))
          while kill -0 "$SERVER_PID" 2>/dev/null && [ "$SECONDS" -lt "$END" ]; do sleep 5; done

          kill "$SERVER_PID" "$CF_PID" 2>/dev/null || true
          xcrun simctl shutdown "$UDID" || true
          echo "Session ended."
